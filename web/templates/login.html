<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 客户管理+收款系统</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-color: #f5222d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .theme-banner {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 5px;
            color: white;
            font-size: 14px;
            display: none;
        }
        .theme-banner.active {
            display: block;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div id="themeBanner" class="theme-banner"></div>
        <h2>系统登录</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">登录</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        // 加载主题配置
        async function loadTheme() {
            try {
                // 从URL参数或子域名获取租户标识
                const urlParams = new URLSearchParams(window.location.search);
                const tenantCode = urlParams.get('tenant') || '';

                if (tenantCode) {
                    const response = await fetch(`/api/public/theme?tenant=${tenantCode}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.code === 200 && data.data) {
                            applyTheme(data.data);
                        }
                    }
                }
            } catch (error) {
                console.log('主题加载失败，使用默认主题');
            }
        }

        // 应用主题样式
        function applyTheme(theme) {
            const root = document.documentElement;

            if (theme.primary_color) {
                root.style.setProperty('--primary-color', theme.primary_color);
            }
            if (theme.secondary_color) {
                root.style.setProperty('--secondary-color', theme.secondary_color);
            }
            if (theme.accent_color) {
                root.style.setProperty('--accent-color', theme.accent_color);
            }
            if (theme.background_image) {
                document.body.style.backgroundImage = `url(${theme.background_image})`;
            }

            // 显示主题横幅消息
            if (theme.welcome_message) {
                const banner = document.getElementById('themeBanner');
                banner.textContent = theme.welcome_message;
                banner.classList.add('active');
            }
        }

        // 页面加载时获取主题
        document.addEventListener('DOMContentLoaded', loadTheme);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.code === 0) {
                    messageDiv.className = 'success';
                    messageDiv.textContent = '登录成功！';

                    // 保存token
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // 跳转到后台
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.textContent = data.message || '登录失败';
                }
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = '网络错误，请重试';
            }
        });
    </script>
</body>
</html>
