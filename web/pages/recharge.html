<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户充值 - 客户管理+收款系统</title>
    <style>
        :root {
            --primary-color: #1890ff;
            --secondary-color: #722ed1;
            --accent-color: #f5222d;
            --success-color: #52c41a;
            --warning-color: #faad14;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 横幅轮播 */
        .banner-carousel {
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .banner-carousel.active {
            display: block;
        }
        .banner-slide {
            position: relative;
        }
        .banner-slide img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        .banner-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        /* 活动区域 */
        .activities-section {
            margin-bottom: 20px;
            display: none;
        }
        .activities-section.active {
            display: block;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .activity-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--accent-color);
        }
        .activity-card h4 {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }
        .activity-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .activity-time {
            font-size: 12px;
            color: #999;
        }
        .activity-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--accent-color);
            color: white;
            font-size: 11px;
            border-radius: 3px;
            margin-left: 8px;
        }

        /* 账户余额卡片 */
        .balance-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .balance-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 600;
            color: var(--primary-color);
        }
        .balance-detail {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        .balance-item {
            flex: 1;
        }
        .balance-item label {
            font-size: 12px;
            color: #999;
        }
        .balance-item span {
            display: block;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-top: 4px;
        }

        /* 充值表单 */
        .recharge-form {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .amount-btn {
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .amount-btn:hover {
            border-color: var(--primary-color);
        }
        .amount-btn.active {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.1);
        }
        .amount-btn .value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .amount-btn .gift {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 4px;
        }
        .custom-amount {
            margin-bottom: 20px;
        }
        .custom-amount label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .custom-amount input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 16px;
        }
        .custom-amount input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .payment-methods {
            margin-bottom: 20px;
        }
        .payment-methods label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .payment-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .payment-option:hover {
            border-color: var(--primary-color);
        }
        .payment-option.active {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.1);
        }
        .payment-option input {
            margin-right: 10px;
        }
        .payment-option span {
            font-size: 14px;
            color: #333;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 消息提示 */
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            display: block;
        }
        .message.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>账户充值</h1>
        <p id="welcomeMessage">为您的账户充值，享受更多服务</p>
    </div>

    <div class="container">
        <!-- 横幅区域 -->
        <div id="bannerCarousel" class="banner-carousel">
            <div class="banner-slide">
                <img id="bannerImage" src="" alt="活动横幅">
                <div id="bannerTitle" class="banner-title"></div>
            </div>
        </div>

        <!-- 活动区域 -->
        <div id="activitiesSection" class="activities-section">
            <div class="section-title">当前活动</div>
            <div id="activitiesList"></div>
        </div>

        <!-- 账户余额 -->
        <div class="balance-card">
            <h3>账户余额</h3>
            <div class="balance-amount">￥<span id="totalBalance">0.00</span></div>
            <div class="balance-detail">
                <div class="balance-item">
                    <label>资金余额</label>
                    <span id="fundBalance">￥0.00</span>
                </div>
                <div class="balance-item">
                    <label>赠送余额</label>
                    <span id="giftBalance">￥0.00</span>
                </div>
                <div class="balance-item">
                    <label>授信额度</label>
                    <span id="creditLimit">￥0.00</span>
                </div>
            </div>
        </div>

        <!-- 充值表单 -->
        <div class="recharge-form">
            <div class="form-title">选择充值金额</div>
            <div id="messageBox" class="message"></div>

            <div class="amount-options">
                <div class="amount-btn" data-amount="100">
                    <div class="value">100</div>
                </div>
                <div class="amount-btn" data-amount="500">
                    <div class="value">500</div>
                    <div class="gift">送50</div>
                </div>
                <div class="amount-btn" data-amount="1000">
                    <div class="value">1000</div>
                    <div class="gift">送120</div>
                </div>
                <div class="amount-btn" data-amount="2000">
                    <div class="value">2000</div>
                    <div class="gift">送280</div>
                </div>
                <div class="amount-btn" data-amount="5000">
                    <div class="value">5000</div>
                    <div class="gift">送800</div>
                </div>
                <div class="amount-btn" data-amount="10000">
                    <div class="value">10000</div>
                    <div class="gift">送1800</div>
                </div>
            </div>

            <div class="custom-amount">
                <label>或输入自定义金额</label>
                <input type="number" id="customAmount" placeholder="请输入充值金额" min="1">
            </div>

            <div class="payment-methods">
                <label>选择支付方式</label>
                <div id="paymentMethodsList"></div>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" onclick="submitRecharge()">
                立即充值
            </button>
        </div>
    </div>

    <script>
        let selectedAmount = 0;
        let selectedPaymentMethod = '';
        const token = localStorage.getItem('token');

        // API请求封装
        async function apiGet(url) {
            const response = await fetch('/api' + url, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            return response.json();
        }

        async function apiPost(url, data) {
            const response = await fetch('/api' + url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            return response.json();
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查登录状态
            if (!token) {
                window.location.href = '/login';
                return;
            }

            // 加载数据
            await Promise.all([
                loadTheme(),
                loadBalance(),
                loadActivities(),
                loadBanners(),
                loadPaymentMethods()
            ]);

            // 绑定金额按钮事件
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedAmount = parseInt(this.dataset.amount);
                    document.getElementById('customAmount').value = '';
                });
            });

            // 自定义金额输入
            document.getElementById('customAmount').addEventListener('input', function() {
                document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
                selectedAmount = parseFloat(this.value) || 0;
            });
        });

        // 加载主题
        async function loadTheme() {
            try {
                const response = await apiGet('/themes/default');
                if (response.code === 200 && response.data) {
                    applyTheme(response.data);
                }
            } catch (error) {
                console.log('主题加载失败');
            }
        }

        // 应用主题
        function applyTheme(theme) {
            const root = document.documentElement;
            if (theme.primary_color) {
                root.style.setProperty('--primary-color', theme.primary_color);
            }
            if (theme.secondary_color) {
                root.style.setProperty('--secondary-color', theme.secondary_color);
            }
            if (theme.accent_color) {
                root.style.setProperty('--accent-color', theme.accent_color);
            }
            if (theme.welcome_message) {
                document.getElementById('welcomeMessage').textContent = theme.welcome_message;
            }
        }

        // 加载账户余额
        async function loadBalance() {
            try {
                const response = await apiGet('/customer/account');
                if (response.code === 200 && response.data) {
                    const account = response.data;
                    const total = (parseFloat(account.fund_balance) || 0) +
                                  (parseFloat(account.gift_balance) || 0);
                    document.getElementById('totalBalance').textContent = total.toFixed(2);
                    document.getElementById('fundBalance').textContent = '￥' + (parseFloat(account.fund_balance) || 0).toFixed(2);
                    document.getElementById('giftBalance').textContent = '￥' + (parseFloat(account.gift_balance) || 0).toFixed(2);
                    document.getElementById('creditLimit').textContent = '￥' + (parseFloat(account.credit_limit) || 0).toFixed(2);
                }
            } catch (error) {
                console.log('余额加载失败');
            }
        }

        // 加载活动
        async function loadActivities() {
            try {
                const response = await apiGet('/activities/active?position=recharge');
                if (response.code === 200 && response.data && response.data.length > 0) {
                    const section = document.getElementById('activitiesSection');
                    const list = document.getElementById('activitiesList');

                    let html = '';
                    response.data.forEach(activity => {
                        const endDate = new Date(activity.end_time).toLocaleDateString('zh-CN');
                        html += `
                            <div class="activity-card">
                                <h4>${activity.name}
                                    <span class="activity-badge">${getActivityTypeText(activity.activity_type)}</span>
                                </h4>
                                <p>${activity.description || ''}</p>
                                <div class="activity-time">活动截止：${endDate}</div>
                            </div>
                        `;
                    });

                    list.innerHTML = html;
                    section.classList.add('active');
                }
            } catch (error) {
                console.log('活动加载失败');
            }
        }

        function getActivityTypeText(type) {
            const types = {
                'promotion': '促销',
                'discount': '折扣',
                'gift': '赠送',
                'points': '积分',
                'lottery': '抽奖'
            };
            return types[type] || type;
        }

        // 加载横幅
        async function loadBanners() {
            try {
                const response = await apiGet('/banners/active?position=recharge');
                if (response.code === 200 && response.data && response.data.length > 0) {
                    const carousel = document.getElementById('bannerCarousel');
                    const banner = response.data[0]; // 显示第一个横幅

                    document.getElementById('bannerImage').src = banner.image_url;
                    document.getElementById('bannerTitle').textContent = banner.title;

                    // 点击横幅
                    document.getElementById('bannerImage').onclick = function() {
                        // 记录点击
                        apiPost(`/banners/${banner.id}/click`, {});
                        if (banner.link_url) {
                            window.open(banner.link_url, '_blank');
                        }
                    };

                    carousel.classList.add('active');
                }
            } catch (error) {
                console.log('横幅加载失败');
            }
        }

        // 加载支付方式
        async function loadPaymentMethods() {
            try {
                const response = await apiGet('/payment-apis?status=active');
                const list = document.getElementById('paymentMethodsList');

                if (response.code === 200 && response.data && response.data.length > 0) {
                    let html = '';
                    response.data.forEach((method, index) => {
                        const checked = index === 0 ? 'checked' : '';
                        const activeClass = index === 0 ? 'active' : '';
                        if (index === 0) selectedPaymentMethod = method.api_code;

                        html += `
                            <div class="payment-option ${activeClass}" onclick="selectPayment(this, '${method.api_code}')">
                                <input type="radio" name="payment" ${checked}>
                                <span>${method.api_name}</span>
                            </div>
                        `;
                    });
                    list.innerHTML = html;
                } else {
                    list.innerHTML = `
                        <div class="payment-option active" onclick="selectPayment(this, 'bank')">
                            <input type="radio" name="payment" checked>
                            <span>银行转账</span>
                        </div>
                    `;
                    selectedPaymentMethod = 'bank';
                }
            } catch (error) {
                console.log('支付方式加载失败');
            }
        }

        // 选择支付方式
        function selectPayment(element, code) {
            document.querySelectorAll('.payment-option').forEach(el => {
                el.classList.remove('active');
                el.querySelector('input').checked = false;
            });
            element.classList.add('active');
            element.querySelector('input').checked = true;
            selectedPaymentMethod = code;
        }

        // 显示消息
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `message ${type}`;
        }

        // 提交充值
        async function submitRecharge() {
            if (selectedAmount <= 0) {
                showMessage('请选择或输入充值金额', 'error');
                return;
            }
            if (!selectedPaymentMethod) {
                showMessage('请选择支付方式', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                const response = await apiPost('/recharges', {
                    amount: selectedAmount,
                    payment_method: selectedPaymentMethod
                });

                if (response.code === 200) {
                    showMessage('充值订单创建成功，请完成支付', 'success');
                    // 如果有支付链接，跳转
                    if (response.data && response.data.payment_url) {
                        setTimeout(() => {
                            window.location.href = response.data.payment_url;
                        }, 1500);
                    }
                } else {
                    showMessage(response.message || '充值失败', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '立即充值';
            }
        }
    </script>
</body>
</html>
