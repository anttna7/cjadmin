<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户充值 - 客户管理+收款系统</title>
    <style>
        :root {
            --primary-color: #1890ff;
            --secondary-color: #722ed1;
            --accent-color: #f5222d;
            --success-color: #52c41a;
            --warning-color: #faad14;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 步骤指示器 */
        .steps {
            display: flex;
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .step::after {
            content: '';
            position: absolute;
            top: 15px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e8e8e8;
        }
        .step:last-child::after {
            display: none;
        }
        .step.active::after {
            background: var(--primary-color);
        }
        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e8e8e8;
            color: #999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .step.active .step-number {
            background: var(--primary-color);
            color: white;
        }
        .step.completed .step-number {
            background: var(--success-color);
            color: white;
        }
        .step-title {
            font-size: 12px;
            color: #999;
        }
        .step.active .step-title {
            color: var(--primary-color);
            font-weight: 500;
        }

        /* 表单卡片 */
        .form-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 公司信息卡片 */
        .company-info {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .company-info h4 {
            color: #389e0d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .company-info p {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        /* 支付类型选择 */
        .payment-type-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .payment-type-btn {
            padding: 20px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .payment-type-btn:hover {
            border-color: var(--primary-color);
        }
        .payment-type-btn.active {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.1);
        }
        .payment-type-btn .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .payment-type-btn .title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .payment-type-btn .desc {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 收款账户信息 */
        .account-info {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .account-info h4 {
            color: #1890ff;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .account-detail {
            margin-bottom: 12px;
        }
        .account-detail label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 4px;
        }
        .account-detail span {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .copy-btn {
            display: inline-block;
            padding: 2px 8px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* 金额选择 */
        .amount-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .amount-btn {
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .amount-btn:hover {
            border-color: var(--primary-color);
        }
        .amount-btn.active {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.1);
        }
        .amount-btn .value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .amount-btn .gift {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* 返点信息 */
        .rebate-info {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .rebate-info h4 {
            color: #d48806;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .rebate-info p {
            font-size: 13px;
            color: #666;
        }
        .rebate-amount {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-color);
        }

        /* 按钮 */
        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-default {
            background: white;
            color: #666;
            border: 1px solid #d9d9d9;
        }
        .btn-default:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-block {
            width: 100%;
            display: block;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-group .btn {
            flex: 1;
        }

        /* 消息提示 */
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            display: block;
        }
        .message.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
            display: block;
        }

        /* 隐藏步骤 */
        .step-content {
            display: none;
        }
        .step-content.active {
            display: block;
        }

        /* 横幅和活动区域 */
        .banner-carousel {
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        .banner-carousel.active {
            display: block;
        }
        .banner-slide img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        .activities-section {
            margin-bottom: 20px;
            display: none;
        }
        .activities-section.active {
            display: block;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .activity-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>账户充值</h1>
        <p id="welcomeMessage">为您的账户充值，享受更多服务</p>
    </div>

    <div class="container">
        <!-- 横幅区域 -->
        <div id="bannerCarousel" class="banner-carousel">
            <div class="banner-slide">
                <img id="bannerImage" src="" alt="活动横幅">
            </div>
        </div>

        <!-- 步骤指示器 -->
        <div class="steps">
            <div class="step active" id="step1Indicator">
                <div class="step-number">1</div>
                <div class="step-title">验证账户</div>
            </div>
            <div class="step" id="step2Indicator">
                <div class="step-number">2</div>
                <div class="step-title">选择方式</div>
            </div>
            <div class="step" id="step3Indicator">
                <div class="step-number">3</div>
                <div class="step-title">确认充值</div>
            </div>
        </div>

        <!-- 活动区域 -->
        <div id="activitiesSection" class="activities-section">
            <div class="section-title">当前活动</div>
            <div id="activitiesList"></div>
        </div>

        <!-- 步骤1：验证账户 -->
        <div class="step-content active" id="step1Content">
            <div class="form-card">
                <div class="form-title">请输入公司名称</div>
                <div id="step1Message" class="message"></div>
                <div class="form-group">
                    <label>公司名称 <span style="color:#f5222d">*</span></label>
                    <input type="text" id="companyName" placeholder="请输入完整的公司名称" required>
                </div>
                <button class="btn btn-primary btn-block" onclick="verifyCompany()">
                    验证账户
                </button>
            </div>
        </div>

        <!-- 步骤2：选择支付方式 -->
        <div class="step-content" id="step2Content">
            <div class="form-card">
                <div class="form-title">选择打款方式</div>
                <div id="step2Message" class="message"></div>

                <!-- 已验证的公司信息 -->
                <div class="company-info" id="verifiedCompanyInfo">
                    <h4>已验证账户</h4>
                    <p><strong>公司名称：</strong><span id="displayCompanyName"></span></p>
                    <p><strong>账户状态：</strong><span style="color:#52c41a">正常</span></p>
                </div>

                <div class="payment-type-options">
                    <div class="payment-type-btn" data-type="public" onclick="selectPaymentType(this, 'public')">
                        <div class="icon">🏛️</div>
                        <div class="title">对公打款</div>
                        <div class="desc">转账至公司对公账户</div>
                    </div>
                    <div class="payment-type-btn" data-type="private" onclick="selectPaymentType(this, 'private')">
                        <div class="icon">👤</div>
                        <div class="title">对私打款</div>
                        <div class="desc">转账至个人银行账户</div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-default" onclick="goToStep(1)">上一步</button>
                    <button class="btn btn-primary" id="step2NextBtn" onclick="getPaymentAccount()" disabled>
                        下一步
                    </button>
                </div>
            </div>
        </div>

        <!-- 步骤3：确认充值 -->
        <div class="step-content" id="step3Content">
            <div class="form-card">
                <div class="form-title">确认充值信息</div>
                <div id="step3Message" class="message"></div>

                <!-- 收款账户信息 -->
                <div class="account-info" id="paymentAccountInfo">
                    <h4>收款账户信息</h4>
                    <div class="account-detail">
                        <label>账户名称</label>
                        <span id="accountHolder">-</span>
                        <button class="copy-btn" onclick="copyText('accountHolder')">复制</button>
                    </div>
                    <div class="account-detail">
                        <label>银行名称</label>
                        <span id="bankName">-</span>
                    </div>
                    <div class="account-detail">
                        <label>银行账号</label>
                        <span id="accountNumber">-</span>
                        <button class="copy-btn" onclick="copyText('accountNumber')">复制</button>
                    </div>
                    <div class="account-detail" id="bankBranchRow" style="display:none">
                        <label>开户支行</label>
                        <span id="bankBranch">-</span>
                    </div>
                </div>

                <!-- 金额选择 -->
                <div class="form-title" style="margin-top:20px">选择充值金额</div>
                <div class="amount-options" id="amountOptions">
                    <!-- 动态生成 -->
                </div>

                <div class="form-group">
                    <label>或输入自定义金额</label>
                    <input type="number" id="customAmount" placeholder="请输入充值金额" min="1" onchange="updateRebateInfo()">
                </div>

                <!-- 返点信息 -->
                <div class="rebate-info" id="rebateInfo" style="display:none">
                    <h4>返点优惠</h4>
                    <p>充值金额：￥<span id="rechargeAmount">0</span></p>
                    <p>返点比例：<span id="rebateRate">0</span>%</p>
                    <p>赠送金额：<span class="rebate-amount" id="giftAmount">￥0</span></p>
                    <p style="margin-top:8px;font-weight:500">实际到账：￥<span id="totalAmount">0</span></p>
                </div>

                <div class="btn-group">
                    <button class="btn btn-default" onclick="goToStep(2)">上一步</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitRecharge()">
                        确认充值
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentStep = 1;
        let verifiedCustomer = null;
        let selectedPaymentType = '';
        let selectedAccount = null;
        let selectedAmount = 0;
        let rebateConfig = null;

        // 从URL获取租户标识
        const urlParams = new URLSearchParams(window.location.search);
        const tenantCode = urlParams.get('tenant') || '';

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await Promise.all([
                loadTheme(),
                loadActivities(),
                loadBanners()
            ]);
        });

        // API请求封装（公共接口，无需认证）
        async function apiPublicGet(url) {
            const response = await fetch('/api/public' + url);
            return response.json();
        }

        async function apiPublicPost(url, data) {
            const response = await fetch('/api/public' + url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            return response.json();
        }

        // 加载主题
        async function loadTheme() {
            if (!tenantCode) return;
            try {
                const response = await apiPublicGet(`/theme?tenant=${tenantCode}`);
                if (response.code === 200 && response.data) {
                    applyTheme(response.data);
                }
            } catch (error) {
                console.log('主题加载失败');
            }
        }

        // 应用主题
        function applyTheme(theme) {
            const root = document.documentElement;
            if (theme.primary_color) {
                root.style.setProperty('--primary-color', theme.primary_color);
            }
            if (theme.secondary_color) {
                root.style.setProperty('--secondary-color', theme.secondary_color);
            }
            if (theme.welcome_message) {
                document.getElementById('welcomeMessage').textContent = theme.welcome_message;
            }
        }

        // 加载活动
        async function loadActivities() {
            if (!tenantCode) return;
            try {
                const response = await apiPublicGet(`/activities?tenant=${tenantCode}&position=recharge`);
                if (response.code === 200 && response.data && response.data.length > 0) {
                    const section = document.getElementById('activitiesSection');
                    const list = document.getElementById('activitiesList');

                    let html = '';
                    response.data.forEach(activity => {
                        html += `<div class="activity-card"><h4>${activity.name}</h4><p>${activity.description || ''}</p></div>`;
                    });

                    list.innerHTML = html;
                    section.classList.add('active');
                }
            } catch (error) {
                console.log('活动加载失败');
            }
        }

        // 加载横幅
        async function loadBanners() {
            if (!tenantCode) return;
            try {
                const response = await apiPublicGet(`/banners?tenant=${tenantCode}&position=recharge`);
                if (response.code === 200 && response.data && response.data.length > 0) {
                    const carousel = document.getElementById('bannerCarousel');
                    const banner = response.data[0];
                    document.getElementById('bannerImage').src = banner.image_url;
                    carousel.classList.add('active');
                }
            } catch (error) {
                console.log('横幅加载失败');
            }
        }

        // 显示消息
        function showMessage(stepNum, text, type) {
            const box = document.getElementById(`step${stepNum}Message`);
            box.textContent = text;
            box.className = `message ${type}`;
        }

        // 步骤1：验证公司
        async function verifyCompany() {
            const companyName = document.getElementById('companyName').value.trim();

            if (!companyName) {
                showMessage(1, '请输入公司名称', 'error');
                return;
            }

            if (!tenantCode) {
                showMessage(1, '缺少租户标识，请检查访问链接', 'error');
                return;
            }

            try {
                const response = await apiPublicPost('/verify-customer', {
                    tenant_code: tenantCode,
                    company_name: companyName
                });

                if (response.code === 200 && response.data) {
                    verifiedCustomer = response.data;
                    document.getElementById('displayCompanyName').textContent = verifiedCustomer.company_name;
                    goToStep(2);
                } else {
                    showMessage(1, response.message || '账户验证失败', 'error');
                }
            } catch (error) {
                showMessage(1, '网络错误，请重试', 'error');
            }
        }

        // 选择支付类型
        function selectPaymentType(element, type) {
            document.querySelectorAll('.payment-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            selectedPaymentType = type;
            document.getElementById('step2NextBtn').disabled = false;
        }

        // 步骤2：获取收款账户
        async function getPaymentAccount() {
            if (!selectedPaymentType) {
                showMessage(2, '请选择打款方式', 'error');
                return;
            }

            try {
                const response = await apiPublicPost('/get-payment-account', {
                    tenant_code: tenantCode,
                    customer_id: verifiedCustomer.id,
                    account_type: selectedPaymentType
                });

                if (response.code === 200 && response.data) {
                    selectedAccount = response.data.account;
                    rebateConfig = response.data.rebate_config;

                    // 显示收款账户信息
                    document.getElementById('accountHolder').textContent = selectedAccount.account_holder || '-';
                    document.getElementById('bankName').textContent = selectedAccount.bank_name || '-';
                    document.getElementById('accountNumber').textContent = selectedAccount.account_number || '-';

                    if (selectedAccount.bank_branch) {
                        document.getElementById('bankBranch').textContent = selectedAccount.bank_branch;
                        document.getElementById('bankBranchRow').style.display = 'block';
                    }

                    // 生成金额选项（根据返点配置）
                    generateAmountOptions();

                    goToStep(3);
                } else {
                    showMessage(2, response.message || '获取收款账户失败', 'error');
                }
            } catch (error) {
                showMessage(2, '网络错误，请重试', 'error');
            }
        }

        // 生成金额选项
        function generateAmountOptions() {
            const container = document.getElementById('amountOptions');
            const amounts = [100, 500, 1000, 2000, 5000, 10000];

            let html = '';
            amounts.forEach(amount => {
                let giftHtml = '';
                if (rebateConfig && rebateConfig.rebate_rate > 0) {
                    const gift = Math.floor(amount * rebateConfig.rebate_rate / 100);
                    if (gift > 0) {
                        giftHtml = `<div class="gift">送${gift}</div>`;
                    }
                }
                html += `
                    <div class="amount-btn" data-amount="${amount}" onclick="selectAmount(this, ${amount})">
                        <div class="value">${amount}</div>
                        ${giftHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 选择金额
        function selectAmount(element, amount) {
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            selectedAmount = amount;
            document.getElementById('customAmount').value = '';
            updateRebateInfo();
        }

        // 更新返点信息
        function updateRebateInfo() {
            const customAmount = parseFloat(document.getElementById('customAmount').value) || 0;
            const amount = customAmount > 0 ? customAmount : selectedAmount;

            if (amount <= 0) {
                document.getElementById('rebateInfo').style.display = 'none';
                return;
            }

            selectedAmount = amount;
            document.getElementById('rechargeAmount').textContent = amount.toFixed(2);

            let rebateRate = 0;
            let giftAmount = 0;

            if (rebateConfig) {
                // 根据打款类型获取返点比例
                if (selectedPaymentType === 'public') {
                    rebateRate = rebateConfig.public_rebate_rate || 0;
                } else {
                    rebateRate = rebateConfig.private_rebate_rate || 0;
                }
                giftAmount = amount * rebateRate / 100;
            }

            document.getElementById('rebateRate').textContent = rebateRate;
            document.getElementById('giftAmount').textContent = '￥' + giftAmount.toFixed(2);
            document.getElementById('totalAmount').textContent = (amount + giftAmount).toFixed(2);
            document.getElementById('rebateInfo').style.display = 'block';
        }

        // 复制文本
        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板');
            }).catch(() => {
                // 兼容旧浏览器
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('已复制到剪贴板');
            });
        }

        // 步骤切换
        function goToStep(step) {
            currentStep = step;

            // 更新步骤指示器
            for (let i = 1; i <= 3; i++) {
                const indicator = document.getElementById(`step${i}Indicator`);
                const content = document.getElementById(`step${i}Content`);

                indicator.classList.remove('active', 'completed');
                content.classList.remove('active');

                if (i < step) {
                    indicator.classList.add('completed');
                } else if (i === step) {
                    indicator.classList.add('active');
                    content.classList.add('active');
                }
            }
        }

        // 提交充值
        async function submitRecharge() {
            if (selectedAmount <= 0) {
                showMessage(3, '请选择或输入充值金额', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                const response = await apiPublicPost('/submit-recharge', {
                    tenant_code: tenantCode,
                    customer_id: verifiedCustomer.id,
                    account_id: selectedAccount.id,
                    amount: selectedAmount,
                    payment_type: selectedPaymentType
                });

                if (response.code === 200) {
                    showMessage(3, '充值订单创建成功！请按照上方账户信息完成转账，转账后系统将自动处理入账。', 'success');
                    btn.textContent = '已提交';

                    // 显示订单信息
                    if (response.data && response.data.order_no) {
                        alert(`充值订单已创建\n订单号：${response.data.order_no}\n\n请按照页面显示的收款账户信息完成转账。转账时请在备注中填写订单号，以便快速入账。`);
                    }
                } else {
                    showMessage(3, response.message || '充值失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认充值';
                }
            } catch (error) {
                showMessage(3, '网络错误，请重试', 'error');
                btn.disabled = false;
                btn.textContent = '确认充值';
            }
        }
    </script>
</body>
</html>
