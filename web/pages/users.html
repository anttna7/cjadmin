<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - CJAdmin</title>
    <link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>用户管理</h1>
            <div class="page-actions">
                <button class="btn btn-primary" onclick="showCreateModal()">
                    <span>+ 创建用户</span>
                </button>
            </div>
        </div>

        <!-- 搜索过滤区 -->
        <div class="card">
            <div class="card-body">
                <form class="search-form" onsubmit="handleSearch(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="filterUsername" class="form-control"
                                   placeholder="搜索用户名">
                        </div>
                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="text" id="filterEmail" class="form-control"
                                   placeholder="搜索邮箱">
                        </div>
                        <div class="form-group">
                            <label>角色</label>
                            <select id="filterRole" class="form-control">
                                <option value="">全部</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>部门</label>
                            <select id="filterDepartment" class="form-control">
                                <option value="">全部</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select id="filterStatus" class="form-control">
                                <option value="">全部</option>
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">搜索</button>
                        <button type="button" class="btn btn-default" onclick="resetFilters()">重置</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-body">
                <div id="userTableContainer">
                    <div class="loading">加载中...</div>
                </div>
                <div id="paginationContainer"></div>
            </div>
        </div>
    </div>

    <!-- 创建/编辑用户模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">创建用户</h2>
                <button class="close" onclick="hideModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm" onsubmit="handleSubmit(event)">
                    <input type="hidden" id="userId">

                    <div class="form-group">
                        <label>用户名 <span class="required">*</span></label>
                        <input type="text" id="username" class="form-control"
                               required placeholder="请输入用户名">
                        <small class="form-text">用于登录，不可修改</small>
                    </div>

                    <div class="form-group">
                        <label>真实姓名 <span class="required">*</span></label>
                        <input type="text" id="realName" class="form-control"
                               required placeholder="请输入真实姓名">
                    </div>

                    <div class="form-group">
                        <label>邮箱 <span class="required">*</span></label>
                        <input type="email" id="email" class="form-control"
                               required placeholder="user@example.com">
                    </div>

                    <div class="form-group">
                        <label>手机号</label>
                        <input type="tel" id="phone" class="form-control"
                               placeholder="手机号码">
                    </div>

                    <div class="form-group" id="passwordGroup">
                        <label>密码 <span class="required">*</span></label>
                        <input type="password" id="password" class="form-control"
                               placeholder="至少8位，包含字母和数字">
                        <small class="form-text">编辑用户时留空表示不修改密码</small>
                    </div>

                    <div class="form-group">
                        <label>部门</label>
                        <select id="departmentId" class="form-control">
                            <option value="">无部门</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>角色 <span class="required">*</span></label>
                        <div id="rolesContainer" class="checkbox-group">
                            <div class="loading">加载角色列表...</div>
                        </div>
                        <small class="form-text">可以选择多个角色</small>
                    </div>

                    <div class="form-group">
                        <label>状态</label>
                        <div class="form-check">
                            <input type="checkbox" id="enabled" class="form-check-input" checked>
                            <label for="enabled" class="form-check-label">启用</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="notes" class="form-control" rows="2"
                                  placeholder="用户备注信息"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-default" onclick="hideModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 分配角色模态框 -->
    <div id="assignRoleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>分配角色</h2>
                <button class="close" onclick="hideAssignRoleModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="assignRoleForm" onsubmit="handleAssignRole(event)">
                    <input type="hidden" id="assignUserId">

                    <div class="form-group">
                        <label>当前用户</label>
                        <input type="text" id="assignUserName" class="form-control" readonly>
                    </div>

                    <div class="form-group">
                        <label>选择角色 <span class="required">*</span></label>
                        <div id="assignRolesContainer" class="checkbox-group">
                            <div class="loading">加载角色列表...</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-default"
                                onclick="hideAssignRoleModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 重置密码模态框 -->
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>重置密码</h2>
                <button class="close" onclick="hideResetPasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                    <input type="hidden" id="resetUserId">

                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="resetUserName" class="form-control" readonly>
                    </div>

                    <div class="form-group">
                        <label>新密码 <span class="required">*</span></label>
                        <input type="password" id="newPassword" class="form-control"
                               required placeholder="至少8位，包含字母和数字">
                    </div>

                    <div class="form-group">
                        <label>确认密码 <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" class="form-control"
                               required placeholder="再次输入新密码">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">重置密码</button>
                        <button type="button" class="btn btn-default"
                                onclick="hideResetPasswordModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../static/js/utils.js"></script>
    <script>
        let pagination;
        let currentFilters = {};
        let allRoles = [];
        let allDepartments = [];

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            checkAuth();
            await loadRoles();
            await loadDepartments();

            pagination = new Pagination(
                document.getElementById('paginationContainer'),
                {
                    page: 1,
                    pageSize: 10,
                    total: 0,
                    onChange: (page, pageSize) => {
                        loadUsers(page, pageSize);
                    }
                }
            );

            loadUsers();
        });

        // 加载所有角色
        async function loadRoles() {
            try {
                const response = await apiGet('/roles', {
                    page: 1,
                    page_size: 1000
                });

                if (response.code === 200) {
                    allRoles = response.data.list || [];
                    updateRoleOptions();
                }
            } catch (error) {
                console.error('加载角色列表失败:', error);
            }
        }

        // 更新角色选项
        function updateRoleOptions() {
            // 更新过滤器中的角色选项
            const filterRoleSelect = document.getElementById('filterRole');
            const roleOptions = allRoles.map(r =>
                `<option value="${r.id}">${r.role_name}</option>`
            ).join('');
            filterRoleSelect.innerHTML = '<option value="">全部</option>' + roleOptions;
        }

        // 渲染角色复选框
        function renderRoleCheckboxes(containerId, selectedRoleIds = []) {
            const container = document.getElementById(containerId);

            if (allRoles.length === 0) {
                container.innerHTML = '<p class="text-muted">暂无可用角色</p>';
                return;
            }

            const html = allRoles.map(role => {
                const checked = selectedRoleIds.includes(role.id) ? 'checked' : '';
                return `
                    <label class="checkbox-item">
                        <input type="checkbox" name="roles" value="${role.id}" ${checked}>
                        ${role.role_name}
                        ${role.description ? `<small>(${role.description})</small>` : ''}
                    </label>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // 加载所有部门
        async function loadDepartments() {
            try {
                const response = await apiGet('/departments');

                if (response.code === 200) {
                    allDepartments = response.data || [];
                    updateDepartmentOptions();
                }
            } catch (error) {
                console.error('加载部门列表失败:', error);
            }
        }

        // 更新部门选项
        function updateDepartmentOptions() {
            const filterDeptSelect = document.getElementById('filterDepartment');
            const deptSelect = document.getElementById('departmentId');

            const buildOptions = (depts, prefix = '') => {
                return depts.map(dept => {
                    const option = `<option value="${dept.id}">${prefix}${dept.department_name}</option>`;
                    const childOptions = dept.children ? buildOptions(dept.children, prefix + '　') : '';
                    return option + childOptions;
                }).join('');
            };

            const options = buildOptions(allDepartments);
            filterDeptSelect.innerHTML = '<option value="">全部</option>' + options;
            deptSelect.innerHTML = '<option value="">无部门</option>' + options;
        }

        // 加载用户列表
        async function loadUsers(page = 1, pageSize = 10) {
            try {
                const params = {
                    page,
                    page_size: pageSize,
                    ...currentFilters
                };

                const response = await apiGet('/users', params);

                if (response.code === 200) {
                    renderTable(response.data.list || []);
                    pagination.setTotal(response.data.total || 0);
                } else {
                    showToast(response.message || '加载用户列表失败', 'error');
                }
            } catch (error) {
                console.error('加载用户列表失败:', error);
                showToast('加载用户列表失败', 'error');
            }
        }

        // 渲染用户表格
        function renderTable(users) {
            if (users.length === 0) {
                document.getElementById('userTableContainer').innerHTML =
                    '<div class="empty-state">暂无用户数据</div>';
                return;
            }

            const html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>真实姓名</th>
                            <th>邮箱</th>
                            <th>手机</th>
                            <th>部门</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.id}</td>
                                <td><strong>${user.username}</strong></td>
                                <td>${user.real_name || '-'}</td>
                                <td>${user.email || '-'}</td>
                                <td>${user.phone || '-'}</td>
                                <td>${user.department_name || '-'}</td>
                                <td>
                                    ${user.roles && user.roles.length > 0 ?
                                        user.roles.map(r =>
                                            `<span class="badge badge-info">${r.role_name}</span>`
                                        ).join(' ') :
                                        '<span class="text-muted">无角色</span>'}
                                </td>
                                <td>
                                    <span class="badge badge-${user.enabled ? 'success' : 'default'}">
                                        ${user.enabled ? '启用' : '禁用'}
                                    </span>
                                </td>
                                <td>${formatDate(user.created_at)}</td>
                                <td>
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-primary"
                                                onclick="editUser(${user.id})"
                                                title="编辑">
                                            编辑
                                        </button>
                                        <button class="btn btn-sm btn-info"
                                                onclick="showAssignRoleModal(${user.id}, '${user.username}')"
                                                title="分配角色">
                                            角色
                                        </button>
                                        <button class="btn btn-sm btn-warning"
                                                onclick="showResetPasswordModal(${user.id}, '${user.username}')"
                                                title="重置密码">
                                            密码
                                        </button>
                                        <button class="btn btn-sm btn-${user.enabled ? 'default' : 'success'}"
                                                onclick="toggleUserStatus(${user.id}, ${!user.enabled})"
                                                title="${user.enabled ? '禁用' : '启用'}">
                                            ${user.enabled ? '禁用' : '启用'}
                                        </button>
                                        <button class="btn btn-sm btn-danger"
                                                onclick="deleteUser(${user.id})"
                                                title="删除">
                                            删除
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('userTableContainer').innerHTML = html;
        }

        // 处理搜索
        function handleSearch(event) {
            event.preventDefault();

            currentFilters = {
                username: document.getElementById('filterUsername').value,
                email: document.getElementById('filterEmail').value,
                role_id: document.getElementById('filterRole').value,
                department_id: document.getElementById('filterDepartment').value,
                enabled: document.getElementById('filterStatus').value
            };

            Object.keys(currentFilters).forEach(key => {
                if (!currentFilters[key]) {
                    delete currentFilters[key];
                }
            });

            pagination.page = 1;
            loadUsers(1, pagination.pageSize);
        }

        // 重置过滤条件
        function resetFilters() {
            document.getElementById('filterUsername').value = '';
            document.getElementById('filterEmail').value = '';
            document.getElementById('filterRole').value = '';
            document.getElementById('filterDepartment').value = '';
            document.getElementById('filterStatus').value = '';
            currentFilters = {};
            pagination.page = 1;
            loadUsers(1, pagination.pageSize);
        }

        // 显示创建模态框
        function showCreateModal() {
            document.getElementById('modalTitle').textContent = '创建用户';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('username').removeAttribute('readonly');
            document.getElementById('password').setAttribute('required', 'required');
            document.getElementById('enabled').checked = true;

            renderRoleCheckboxes('rolesContainer', []);

            document.getElementById('userModal').classList.add('show');
        }

        // 编辑用户
        async function editUser(id) {
            try {
                const response = await apiGet(`/users/${id}`);

                if (response.code === 200) {
                    const user = response.data;
                    document.getElementById('modalTitle').textContent = '编辑用户';
                    document.getElementById('userId').value = user.id;
                    document.getElementById('username').value = user.username;
                    document.getElementById('username').setAttribute('readonly', 'readonly');
                    document.getElementById('realName').value = user.real_name || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('password').removeAttribute('required');
                    document.getElementById('password').value = '';
                    document.getElementById('departmentId').value = user.department_id || '';
                    document.getElementById('enabled').checked = user.enabled;
                    document.getElementById('notes').value = user.notes || '';

                    const roleIds = user.roles ? user.roles.map(r => r.id) : [];
                    renderRoleCheckboxes('rolesContainer', roleIds);

                    document.getElementById('userModal').classList.add('show');
                } else {
                    showToast(response.message || '加载用户失败', 'error');
                }
            } catch (error) {
                console.error('加载用户失败:', error);
                showToast('加载用户失败', 'error');
            }
        }

        // 提交表单
        async function handleSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            // 获取选中的角色
            const roleCheckboxes = document.querySelectorAll('#rolesContainer input[name="roles"]:checked');
            const roleIds = Array.from(roleCheckboxes).map(cb => parseInt(cb.value));

            if (roleIds.length === 0) {
                showToast('请至少选择一个角色', 'warning');
                return;
            }

            const data = {
                username: document.getElementById('username').value,
                real_name: document.getElementById('realName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                department_id: document.getElementById('departmentId').value || null,
                enabled: document.getElementById('enabled').checked,
                notes: document.getElementById('notes').value,
                role_ids: roleIds
            };

            // 只有在创建或密码不为空时才发送密码
            if (!id || password) {
                data.password = password;
            }

            try {
                let response;
                if (id) {
                    response = await apiPut(`/users/${id}`, data);
                } else {
                    response = await apiPost('/users', data);
                }

                if (response.code === 200) {
                    showToast(id ? '用户更新成功' : '用户创建成功', 'success');
                    hideModal();
                    loadUsers(pagination.page, pagination.pageSize);
                } else {
                    showToast(response.message || '操作失败', 'error');
                }
            } catch (error) {
                console.error('保存用户失败:', error);
                showToast('保存用户失败', 'error');
            }
        }

        // 显示分配角色模态框
        async function showAssignRoleModal(userId, username) {
            document.getElementById('assignUserId').value = userId;
            document.getElementById('assignUserName').value = username;

            try {
                const response = await apiGet(`/users/${userId}`);
                if (response.code === 200) {
                    const roleIds = response.data.roles ? response.data.roles.map(r => r.id) : [];
                    renderRoleCheckboxes('assignRolesContainer', roleIds);
                    document.getElementById('assignRoleModal').classList.add('show');
                }
            } catch (error) {
                console.error('加载用户角色失败:', error);
                showToast('加载用户角色失败', 'error');
            }
        }

        // 处理分配角色
        async function handleAssignRole(event) {
            event.preventDefault();

            const userId = document.getElementById('assignUserId').value;
            const roleCheckboxes = document.querySelectorAll('#assignRolesContainer input[name="roles"]:checked');
            const roleIds = Array.from(roleCheckboxes).map(cb => parseInt(cb.value));

            if (roleIds.length === 0) {
                showToast('请至少选择一个角色', 'warning');
                return;
            }

            try {
                const response = await apiPost(`/users/${userId}/roles`, { role_ids: roleIds });

                if (response.code === 200) {
                    showToast('角色分配成功', 'success');
                    hideAssignRoleModal();
                    loadUsers(pagination.page, pagination.pageSize);
                } else {
                    showToast(response.message || '分配角色失败', 'error');
                }
            } catch (error) {
                console.error('分配角色失败:', error);
                showToast('分配角色失败', 'error');
            }
        }

        // 显示重置密码模态框
        function showResetPasswordModal(userId, username) {
            document.getElementById('resetUserId').value = userId;
            document.getElementById('resetUserName').value = username;
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('resetPasswordModal').classList.add('show');
        }

        // 处理重置密码
        async function handleResetPassword(event) {
            event.preventDefault();

            const userId = document.getElementById('resetUserId').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showToast('两次输入的密码不一致', 'warning');
                return;
            }

            if (newPassword.length < 8) {
                showToast('密码至少需要8位', 'warning');
                return;
            }

            try {
                const response = await apiPost(`/users/${userId}/reset-password`, {
                    password: newPassword
                });

                if (response.code === 200) {
                    showToast('密码重置成功', 'success');
                    hideResetPasswordModal();
                } else {
                    showToast(response.message || '重置密码失败', 'error');
                }
            } catch (error) {
                console.error('重置密码失败:', error);
                showToast('重置密码失败', 'error');
            }
        }

        // 切换用户状态
        async function toggleUserStatus(id, enabled) {
            try {
                const response = await apiPut(`/users/${id}`, { enabled });

                if (response.code === 200) {
                    showToast(enabled ? '用户已启用' : '用户已禁用', 'success');
                    loadUsers(pagination.page, pagination.pageSize);
                } else {
                    showToast(response.message || '操作失败', 'error');
                }
            } catch (error) {
                console.error('操作失败:', error);
                showToast('操作失败', 'error');
            }
        }

        // 删除用户
        async function deleteUser(id) {
            if (!confirm('确定要删除这个用户吗？此操作不可恢复！')) {
                return;
            }

            try {
                const response = await apiDelete(`/users/${id}`);

                if (response.code === 200) {
                    showToast('用户已删除', 'success');
                    loadUsers(pagination.page, pagination.pageSize);
                } else {
                    showToast(response.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除失败:', error);
                showToast('删除失败', 'error');
            }
        }

        // 隐藏模态框
        function hideModal() {
            document.getElementById('userModal').classList.remove('show');
        }

        function hideAssignRoleModal() {
            document.getElementById('assignRoleModal').classList.remove('show');
        }

        function hideResetPasswordModal() {
            document.getElementById('resetPasswordModal').classList.remove('show');
        }

        // 点击模态框背景关闭
        window.onclick = function(event) {
            const userModal = document.getElementById('userModal');
            const assignRoleModal = document.getElementById('assignRoleModal');
            const resetPasswordModal = document.getElementById('resetPasswordModal');

            if (event.target === userModal) {
                hideModal();
            }
            if (event.target === assignRoleModal) {
                hideAssignRoleModal();
            }
            if (event.target === resetPasswordModal) {
                hideResetPasswordModal();
            }
        }
    </script>

    <style>
        .checkbox-group {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
        }

        .checkbox-item {
            display: block;
            padding: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .checkbox-item:hover {
            background-color: var(--bg-color);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
        }

        .checkbox-item small {
            color: var(--info-color);
            margin-left: 4px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            margin: 0;
        }

        .form-check-label {
            margin: 0;
            cursor: pointer;
        }
    </style>
</body>
</html>
