<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - CJAdmin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="header">
        <h1>CJAdmin 客户管理+收款系统</h1>
        <div class="user-info">
            <span id="username">管理员</span>
            <button class="btn btn-sm btn-default" onclick="logout()">退出登录</button>
        </div>
    </div>

    <nav class="nav">
        <ul class="nav-list">
            <li class="nav-item"><a href="/pages/tenants.html">租户管理</a></li>
            <li class="nav-item"><a href="/pages/customers.html" class="active">客户管理</a></li>
            <li class="nav-item"><a href="/pages/orders.html">订单管理</a></li>
            <li class="nav-item"><a href="/pages/finance.html">财务管理</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="card-title">客户列表</div>
                <div class="flex gap-10">
                    <button class="btn btn-success" onclick="exportCustomers()">导出客户</button>
                    <button class="btn btn-primary" onclick="showCreateModal()">+ 创建客户</button>
                </div>
            </div>

            <form class="form-inline mb-20" onsubmit="searchCustomers(event)">
                <div class="form-group">
                    <input type="text" class="form-control" id="searchKeyword" placeholder="搜索客户名称">
                </div>
                <div class="form-group">
                    <select class="form-control" id="searchLevel">
                        <option value="">全部等级</option>
                        <option value="S">S级</option>
                        <option value="A">A级</option>
                        <option value="B">B级</option>
                        <option value="C">C级</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">搜索</button>
                <button type="button" class="btn btn-default" onclick="resetSearch()">重置</button>
            </form>

            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
            </div>

            <div id="paginationContainer"></div>
        </div>
    </div>

    <div id="customerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">创建客户</h3>
                <button class="modal-close" onclick="hideModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <input type="hidden" id="customerId">
                    <div class="form-group">
                        <label class="form-label">客户名称 *</label>
                        <input type="text" class="form-control" id="customerName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">客户类型 *</label>
                        <select class="form-control" id="customerType" required>
                            <option value="enterprise">企业客户</option>
                            <option value="individual">个人客户</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">行业</label>
                        <input type="text" class="form-control" id="industry">
                    </div>
                    <div class="form-group">
                        <label class="form-label">客户等级</label>
                        <select class="form-control" id="level">
                            <option value="S">S级</option>
                            <option value="A">A级</option>
                            <option value="B">B级</option>
                            <option value="C">C级</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系人</label>
                        <input type="text" class="form-control" id="contactPerson">
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系电话</label>
                        <input type="tel" class="form-control" id="contactPhone">
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="contactEmail">
                    </div>
                    <div class="form-group">
                        <label class="form-label">地址</label>
                        <input type="text" class="form-control" id="address">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="hideModal()">取消</button>
                <button class="btn btn-primary" onclick="saveCustomer()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        let pagination;
        let currentFilters = {};

        window.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn()) {
                window.location.href = '/login.html';
                return;
            }

            pagination = new Pagination('#paginationContainer', {
                page: 1,
                pageSize: 10,
                total: 0,
                onChange: (page, pageSize) => loadCustomers(page, pageSize)
            });

            loadCustomers(1, 10);
        });

        async function loadCustomers(page = 1, pageSize = 10) {
            try {
                const response = await apiGet('/customers', {
                    page,
                    page_size: pageSize,
                    ...currentFilters
                });

                if (response.code === 200) {
                    renderTable(response.data.list || []);
                    pagination.setTotal(response.data.total || 0);
                }
            } catch (error) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>加载失败：${error.message}</div>
                    </div>
                `;
            }
        }

        function renderTable(customers) {
            if (!customers || customers.length === 0) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👥</div>
                        <div>暂无客户数据</div>
                    </div>
                `;
                return;
            }

            const levelMap = {
                S: { text: 'S级', type: 'danger' },
                A: { text: 'A级', type: 'success' },
                B: { text: 'B级', type: 'warning' },
                C: { text: 'C级', type: 'info' }
            };

            const html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>客户名称</th>
                            <th>类型</th>
                            <th>行业</th>
                            <th>等级</th>
                            <th>联系人</th>
                            <th>联系电话</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${customers.map(customer => `
                            <tr>
                                <td>${customer.id}</td>
                                <td>${customer.customer_name}</td>
                                <td>${customer.customer_type === 'enterprise' ? '企业' : '个人'}</td>
                                <td>${customer.industry || '-'}</td>
                                <td>${getStatusBadge(customer.level, levelMap)}</td>
                                <td>${customer.contact_person || '-'}</td>
                                <td>${customer.contact_phone || '-'}</td>
                                <td>${formatDate(customer.created_at, 'YYYY-MM-DD')}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="editCustomer(${customer.id})">编辑</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${customer.id})">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('tableContainer').innerHTML = html;
        }

        function searchCustomers(event) {
            event.preventDefault();
            currentFilters = {
                keyword: document.getElementById('searchKeyword').value,
                level: document.getElementById('searchLevel').value
            };
            pagination.page = 1;
            loadCustomers(1, pagination.pageSize);
        }

        function resetSearch() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchLevel').value = '';
            currentFilters = {};
            pagination.page = 1;
            loadCustomers(1, pagination.pageSize);
        }

        function showCreateModal() {
            document.getElementById('modalTitle').textContent = '创建客户';
            document.getElementById('customerForm').reset();
            document.getElementById('customerId').value = '';
            new Modal('customerModal').show();
        }

        async function editCustomer(id) {
            try {
                const response = await apiGet(`/customers/${id}`);
                if (response.code === 200) {
                    const customer = response.data;
                    document.getElementById('modalTitle').textContent = '编辑客户';
                    document.getElementById('customerId').value = customer.id;
                    document.getElementById('customerName').value = customer.customer_name;
                    document.getElementById('customerType').value = customer.customer_type;
                    document.getElementById('industry').value = customer.industry || '';
                    document.getElementById('level').value = customer.level;
                    document.getElementById('contactPerson').value = customer.contact_person || '';
                    document.getElementById('contactPhone').value = customer.contact_phone || '';
                    document.getElementById('contactEmail').value = customer.contact_email || '';
                    document.getElementById('address').value = customer.address || '';
                    new Modal('customerModal').show();
                }
            } catch (error) {
                showToast('加载客户信息失败', 'error');
            }
        }

        async function saveCustomer() {
            const form = document.getElementById('customerForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const id = document.getElementById('customerId').value;
            const data = {
                customer_name: document.getElementById('customerName').value,
                customer_type: document.getElementById('customerType').value,
                industry: document.getElementById('industry').value,
                level: document.getElementById('level').value,
                contact_person: document.getElementById('contactPerson').value,
                contact_phone: document.getElementById('contactPhone').value,
                contact_email: document.getElementById('contactEmail').value,
                address: document.getElementById('address').value
            };

            try {
                if (id) {
                    await apiPut(`/customers/${id}`, data);
                    showToast('客户更新成功', 'success');
                } else {
                    await apiPost('/customers', data);
                    showToast('客户创建成功', 'success');
                }

                hideModal();
                loadCustomers(pagination.page, pagination.pageSize);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function deleteCustomer(id) {
            if (!await confirm('确定要删除该客户吗？')) return;

            try {
                await apiDelete(`/customers/${id}`);
                showToast('客户已删除', 'success');
                loadCustomers(pagination.page, pagination.pageSize);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function exportCustomers() {
            try {
                window.location.href = API_BASE_URL + '/customers/export?token=' + getToken();
                showToast('导出成功', 'success');
            } catch (error) {
                showToast('导出失败', 'error');
            }
        }

        function hideModal() {
            new Modal('customerModal').hide();
        }
    </script>
</body>
</html>
