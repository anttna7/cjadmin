groups:
  - name: cjadmin_app_alerts
    interval: 30s
    rules:
      # 应用服务停机告警
      - alert: AppServiceDown
        expr: up{job="cjadmin-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: cjadmin
        annotations:
          summary: "CJAdmin应用服务停机"
          description: "CJAdmin应用服务已停机超过1分钟 (instance {{ $labels.instance }})"

      # 高错误率告警
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: cjadmin
        annotations:
          summary: "HTTP 5xx错误率过高"
          description: "5xx错误率超过5% (当前值: {{ $value }})"

      # 慢响应告警
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: cjadmin
        annotations:
          summary: "API响应时间过慢"
          description: "95分位响应时间超过1秒 (当前值: {{ $value }}s)"

      # 高CPU使用率告警
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="cjadmin-app"}[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: cjadmin
        annotations:
          summary: "应用CPU使用率过高"
          description: "CPU使用率超过80% (当前值: {{ $value }}%)"

      # 高内存使用率告警
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="cjadmin-app"} / 1024 / 1024 / 1024 > 2
        for: 10m
        labels:
          severity: warning
          service: cjadmin
        annotations:
          summary: "应用内存使用过高"
          description: "内存使用超过2GB (当前值: {{ $value }}GB)"

      # Goroutine数量过多告警
      - alert: HighGoroutineCount
        expr: go_goroutines{job="cjadmin-app"} > 1000
        for: 10m
        labels:
          severity: warning
          service: cjadmin
        annotations:
          summary: "Goroutine数量过多"
          description: "Goroutine数量超过1000 (当前值: {{ $value }})"

  - name: database_alerts
    interval: 30s
    rules:
      # 数据库连接数告警
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "数据库连接数过多"
          description: "数据库连接数超过80 (当前值: {{ $value }})"

      # 数据库死锁告警
      - alert: DatabaseDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "检测到数据库死锁"
          description: "数据库发生死锁 (速率: {{ $value }}/s)"

      # 数据库复制延迟告警
      - alert: DatabaseReplicationLag
        expr: pg_replication_lag > 10
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "数据库复制延迟过高"
          description: "复制延迟超过10秒 (当前值: {{ $value }}s)"

  - name: redis_alerts
    interval: 30s
    rules:
      # Redis内存使用率告警
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用超过90% (当前值: {{ $value }}%)"

      # Redis连接数告警
      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis连接数过多"
          description: "Redis连接数超过100 (当前值: {{ $value }})"

      # Redis驱逐键告警
      - alert: RedisEvictedKeys
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis开始驱逐键"
          description: "Redis由于内存不足开始驱逐键 (速率: {{ $value }}/s)"

  - name: system_alerts
    interval: 30s
    rules:
      # 磁盘空间告警
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 20
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘剩余空间低于20% (设备: {{ $labels.device }}, 当前值: {{ $value }}%)"

      # 系统CPU使用率告警
      - alert: SystemHighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "系统CPU使用率过高"
          description: "系统CPU使用率超过85% (当前值: {{ $value }}%)"

      # 系统内存使用率告警
      - alert: SystemHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "系统内存使用率过高"
          description: "系统内存使用率超过90% (当前值: {{ $value }}%)"
