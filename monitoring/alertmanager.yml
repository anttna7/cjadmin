global:
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # 关键告警立即发送
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 1h

    # 警告级别告警
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 6h

# 接收者配置
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://app:8080/api/webhooks/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://app:8080/api/webhooks/alerts/critical'
        send_resolved: true
    # 邮件通知 (需要配置SMTP)
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'your_password'
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://app:8080/api/webhooks/alerts/warning'
        send_resolved: true

# 抑制规则
inhibit_rules:
  # 当服务停机时，抑制其他相关告警
  - source_match:
      severity: 'critical'
      alertname: 'AppServiceDown'
    target_match:
      severity: 'warning'
    equal: ['service']
