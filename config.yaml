server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug, release

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "cjadmin"
  sslmode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

jwt:
  secret: "your-secret-key-change-in-production"
  expire_hours: 24

upload:
  max_size: 10485760 # 10MB
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "application/pdf"
    - "application/vnd.ms-excel"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  upload_path: "./uploads"

security:
  bcrypt_cost: 10
  password_min_length: 6
  session_timeout: 3600

logging:
  level: "info"
  file: "./logs/app.log"
  max_size: 100
  max_backups: 10
  max_age: 30
